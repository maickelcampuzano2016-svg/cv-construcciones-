<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CV Construcciones y Servicios SAS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f4f4f4;
color:#222;
line-height:1.6;
}

/* ENCABEZADO */

header{
background:#111;
color:white;
padding:18px 6%;
display:flex;
align-items:center;
justify-content:space-between;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 2px 10px rgba(0,0,0,.3);
}

.logo{
font-size:24px;
font-weight:bold;
color:#f5b900;
}

.logo span{
color:white;
}

nav{
display:flex;
gap:20px;
}

nav a{
color:white;
text-decoration:none;
font-weight:bold;
}

nav a:hover{
color:#f5b900;
}

/* INICIO */

.hero{
min-height:85vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:40px 20px;

background:
linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,.72)),
url("https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fit=crop&w=1600&q=80");

background-size:cover;
background-position:center;
color:white;
}

.hero h1{
font-size:48px;
margin-bottom:15px;
}

.hero h1 span{
color:#f5b900;
}

.hero p{
font-size:20px;
max-width:800px;
margin:10px auto;
}

.boton{
display:inline-block;
margin-top:25px;
background:#f5b900;
color:#111;
padding:14px 28px;
border-radius:5px;
text-decoration:none;
font-weight:bold;
}

/* SECCIONES */

section{
padding:70px 6%;
}

.titulo{
text-align:center;
margin-bottom:45px;
}

.titulo h2{
font-size:36px;
margin-bottom:10px;
}

.linea{
width:70px;
height:4px;
background:#f5b900;
margin:auto;
}

/* NOSOTROS */

.nosotros{
max-width:1000px;
margin:auto;
text-align:center;
}

.nosotros p{
font-size:18px;
margin-bottom:20px;
}

.propietarios{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:25px;
margin-top:35px;
}

.propietario{
background:white;
padding:30px;
border-radius:8px;
box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.propietario h3{
margin-bottom:8px;
}

.propietario p{
color:#
